services:
  - type: web
    name: echonote-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ECHONOTE_ENVIRONMENT
        value: production
      - key: ECHONOTE_DATABASE_URL
        sync: false
      - key: ECHONOTE_CORS_ORIGINS
        sync: false
      - key: ECHONOTE_AUTH_REQUIRED
        value: true
      - key: ECHONOTE_SUPABASE_URL
        sync: false
